[package]
name = "rusty-pg-vault"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.2", features = ["derive", "env"] }
tokio = { version = "1.45.1", features = ["full"] }
aws-sdk-s3 = "1.86.0"
aws-config = "1.6.3"
aws-types = "1.3.7"
anyhow = "1.0"
thiserror = "2.0.12"
sequoia-openpgp = { version = "2.0.0", default-features = false, features = ["crypto-nettle"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15.11"
tracing = "0.1"
chrono = "0.4"
comfy-table = "7.1.0"
indicatif = "0.17.7"
console = "0.15.8"
async-trait = "0.1.77"
age = { version = "0.11.1", features = ["async"] }
tokio-util = { version = "0.7.15", features = ["io", "io-util", "compat"] }
bytes = "1.5.0"
futures = "0.3"
futures-util = "0.3"
flate2 = { version = "1.0", features = ["rust_backend"] }
rand = "0.8.5"

[dev-dependencies]
mockall = "0.12.1"
